<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aevia Pup — Aevia Lab</title>
<meta name="description" content="Aevia Pup: Dog Care & Diary — A comprehensive dog care and diary application.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* Hero */
  .revive-hero {
    padding: 160px 0 0;
    text-align: center;
    background: linear-gradient(180deg, #FFFFFF 0%, var(--color-bg) 100%);
  }
  .revive-hero .label { display: block; margin-bottom: 16px; color: var(--color-text-tertiary); }
  .revive-hero__sub {
    max-width: 640px;
    margin: 24px auto 0;
    font-size: 17px;
    line-height: 1.6;
    color: var(--color-text-secondary);
  }
  .revive-hero__media {
    max-width: 1180px;
    margin: 72px auto 0;
    padding: 0 clamp(24px, 5vw, 80px);
  }
  .revive-hero__icon-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
  }
  .revive-hero__icon {
    width: 120px;
    height: 120px;
    border-radius: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.10);
    margin-bottom: 24px;
  }
  .revive-hero__icon-name {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    color: var(--color-text);
    margin-bottom: 8px;
    letter-spacing: -0.015em;
  }

  /* Legal links */
  .revive-household__legal { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 28px; }
  .revive-household__legal a { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.45); transition: color 0.2s; }
  .revive-household__legal a:hover { color: rgba(255,255,255,0.85); }

  /* Content placeholder */
  .content-placeholder {
    padding: 80px 0;
    text-align: center;
  }
  .content-placeholder p {
    font-size: 18px;
    color: var(--color-text-secondary);
  }
</style>
</head>
<body>

<div id="header-placeholder"></div>

<!-- HERO -->
<section class="revive-hero">
  <div class="container">
    <span class="label">Application &middot; Dog Care & Diary</span>
    <h1 class="heading-hero" style="font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.025em; max-width: 900px; margin: 0 auto;">Aevia <em style="font-style: italic; color: var(--color-accent);">Pup.</em></h1>
    <p class="revive-hero__sub">
      Aevia Pup: Dog Care & Diary — Content coming soon.
    </p>
  </div>
  <div class="revive-hero__media">
    <div class="revive-hero__icon-wrap">
      <div class="revive-hero__icon-name">Aevia Pup</div>
    </div>
  </div>
</section>

<!-- CONTENT PLACEHOLDER -->
<section class="content-placeholder">
  <div class="container">
    <p>Content coming soon.</p>
  </div>
</section>

<!-- LEGAL LINKS -->
<section style="background: var(--color-text); padding: 60px 0;">
  <div class="container">
    <div class="revive-household__legal" style="justify-content: center;">
      <a href="/apps/aevia-pup/support">Support &amp; FAQ</a>
      <a href="/apps/aevia-pup/privacy-policy">Privacy Policy</a>
      <a href="/apps/aevia-pup/terms-of-use">Terms of Use</a>
    </div>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="/js/layout.js"></script>
</body>
</html>
